# Docker Compose configuration for GreekNN Risk System (Standalone)

version: '3.8'

services:
  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greeknn-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - ENABLE_NEWS=false
      - ENABLE_NLP=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped