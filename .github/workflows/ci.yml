# .github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  # ==================== Static Analysis ====================
  
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -q black isort mypy flake8
          pip install -q -r requirements.txt
      
      - name: Run black (format check)
        run: |
          black --check --diff . || true
        continue-on-error: true
      
      - name: Run isort (import check)
        run: |
          isort --check-only --diff . || true
        continue-on-error: true
      
      - name: Run mypy (type check)
        run: |
          mypy . --ignore-missing-imports --follow-imports=skip || true
        continue-on-error: true
      
      - name: Run flake8
        run: |
          flake8 . --max-line-length=120 --extend-ignore=E203,W503 || true
        continue-on-error: true

  # ==================== Unit Tests ====================
  
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q pytest pytest-cov pytest-asyncio
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short -x
        continue-on-error: true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ==================== Integration Tests ====================
  
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q pytest pytest-cov pytest-asyncio httpx
      
      - name: Run integration tests
        run: |
          pytest tests/test_api_endpoint.py -v --tb=short -x
        env:
          REDIS_HOST: localhost
          POSTGRES_HOST: localhost
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: test_db
        continue-on-error: true

  # ==================== Security Scan ====================
  
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install security tools
        run: |
          pip install -q bandit safety pip-audit
      
      - name: Run Bandit (security check)
        run: |
          bandit -r . -f json -o bandit_report.json || true
        continue-on-error: true
      
      - name: Run Safety (known vulnerabilities)
        run: |
          safety check --json || true
        continue-on-error: true

  # ==================== Docker Build ====================
  
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: greek_nn:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      
      - name: Run container health check
        run: |
          docker run -d --name test_container greek_nn:${{ github.sha }}
          sleep 5
          docker logs test_container || true
          docker stop test_container || true
          docker rm test_container || true

  # ==================== Deploy Staging ====================
  
  deploy-staging:
    name: Deploy to Staging
    needs: [lint, test-unit, docker]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    environment:
      name: staging
      url: https://staging.greeknn.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Add deployment commands here
          # e.g., ansible-playbook deploy.yml -i environments/staging
        env:
          DEPLOY_ENV: staging
          API_HOST: staging.greeknn.example.com
        continue-on-error: true

  # ==================== Deploy Production ====================
  
  deploy-production:
    name: Deploy to Production
    needs: [lint, test-unit, test-integration, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    environment:
      name: production
      url: https://greeknn.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
      
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add deployment commands here
          # e.g., ansible-playbook deploy.yml -i environments/production
        env:
          DEPLOY_ENV: production
          API_HOST: greeknn.example.com
        continue-on-error: true

  # ==================== Notification ====================
  
  notify:
    name: Notify Status
    needs: [deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Check job status
        run: |
          echo "Pipeline completed with status: ${{ needs.*.result }}"